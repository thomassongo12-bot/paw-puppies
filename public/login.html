<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin Login - Paw Puppies</title>
  <link rel="stylesheet" href="/css/admin.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(135deg, #C0541A 0%, #5A8A3C 100%); }
    .login-box { background: #fff; border-radius: 16px; padding: 40px; width: 100%; max-width: 380px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
    .login-logo { text-align: center; margin-bottom: 28px; }
    .login-logo .icon { display: flex; align-items: center; justify-content: center; }
    .login-logo h1 { font-size: 24px; font-weight: 800; color: #C0541A; margin-top: 8px; }
    .login-logo p { color: #718096; font-size: 14px; }
    .login-box .form-group { margin-bottom: 16px; }
    .login-box label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; }
    .login-box input { width: 100%; padding: 11px 14px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 14px; outline: none; transition: 0.2s; }
    .login-box input:focus { border-color: #C0541A; box-shadow: 0 0 0 3px rgba(192,84,26,0.1); }
    .login-btn { width: 100%; background: #C0541A; color: #fff; border: none; padding: 13px; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 8px; transition: 0.2s; }
    .login-btn:hover { background: #9c4214; }
    .error-msg { background: #fff5f5; color: #c53030; padding: 10px 14px; border-radius: 8px; font-size: 14px; margin-bottom: 14px; display: none; }
    .back-link { display: block; text-align: center; margin-top: 16px; color: #718096; font-size: 13px; }
    .back-link a { color: #C0541A; }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="login-logo">
      <div class="icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 64 64" fill="none">
          <ellipse cx="32" cy="40" rx="18" ry="14" fill="#C0541A" opacity=".9"/>
          <ellipse cx="32" cy="40" rx="11" ry="8" fill="#fff" opacity=".25"/>
          <ellipse cx="18" cy="24" rx="5.5" ry="7" fill="#C0541A"/>
          <ellipse cx="46" cy="24" rx="5.5" ry="7" fill="#C0541A"/>
          <ellipse cx="26" cy="18" rx="4.5" ry="6" fill="#C0541A"/>
          <ellipse cx="38" cy="18" rx="4.5" ry="6" fill="#C0541A"/>
        </svg>
      </div>
      <h1>Paw Puppies Admin</h1>
      <p>Sign in to your admin panel</p>
    </div>
    <div class="error-msg" id="error-msg"></div>
    <div class="form-group">
      <label>Username</label>
      <input type="text" id="username" placeholder="admin" autocomplete="username">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="login-btn" onclick="login()" id="login-btn">Sign In</button>
    <div class="back-link"><a href="/">← Back to site</a></div>
  </div>
<script>
  // If already logged in, redirect
  if (localStorage.getItem('admin_token')) {
    fetch('/api/auth/verify', { headers: { Authorization: `Bearer ${localStorage.getItem('admin_token')}` } })
      .then(r => r.json()).then(d => { if (d.valid) location.href = '/admin/'; });
  }

  document.getElementById('password').addEventListener('keypress', e => e.key === 'Enter' && login());

  async function login() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('login-btn');
    const err = document.getElementById('error-msg');

    if (!username || !password) { showError('Please fill in all fields'); return; }
    btn.disabled = true; btn.textContent = 'Signing in...';
    err.style.display = 'none';
    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      if (data.token) {
        localStorage.setItem('admin_token', data.token);
        localStorage.setItem('admin_user', JSON.stringify(data.user));
        location.href = '/admin/';
      } else {
        showError(data.error || 'Invalid credentials');
        btn.disabled = false; btn.textContent = 'Sign In';
      }
    } catch {
      showError('Server connection error');
      btn.disabled = false; btn.textContent = 'Sign In';
    }
  }

  function showError(msg) {
    const err = document.getElementById('error-msg');
    err.textContent = msg;
    err.style.display = 'block';
  }
</script>
</body>
</html>
