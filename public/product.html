  <meta id="tw-image" name="twitter:image" content="https://Paw Puppies.com/images/hero-dachshund.jpg">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    /* ══ BREADCRUMB ══ */
    .pup-breadcrumb { font-size:12px; color:var(--text-light); padding:14px 0 10px; }
    .pup-breadcrumb a { color:var(--text-light); }
    .pup-breadcrumb a:hover { color:var(--primary); }

    /* ══ MAIN GRID ══ */
    .pup-grid {
      display:grid;
      grid-template-columns:1fr 360px;
      gap:32px;
      padding:0 0 60px;
      align-items:start;
    }

    /* ══ LEFT: gallery + description ══ */
    .pup-left {}

    /* Main image */
    .pup-main-img-wrap {
      position:relative;
      background:#f7f9fc;
      border:1px solid var(--border);
      border-radius:6px;
      overflow:hidden;
      cursor:zoom-in;
    }
    .pup-main-img-wrap img {
      width:100%; aspect-ratio:4/3;
      object-fit:cover; display:block;
      transition:transform 0.4s;
    }
    .pup-main-img-wrap:hover img { transform:scale(1.03); }
    .pup-zoom-icon {
      position:absolute; top:12px; right:12px;
      background:rgba(255,255,255,0.85); border-radius:50%;
      width:32px; height:32px; display:flex; align-items:center; justify-content:center;
      font-size:16px; color:#555; pointer-events:none;
    }
    /* Puppy name overlay on main image */
    .pup-name-overlay {
      position:absolute; bottom:12px; left:12px;
      background:rgba(255,255,255,0.92);
      padding:6px 14px 6px 10px;
      border-radius:4px; font-size:13px; font-weight:700;
      color:#1a3c4e; display:flex; align-items:center; gap:8px;
      backdrop-filter:blur(4px);
    }
    .pup-name-overlay img { width:28px; height:28px; border-radius:50%; object-fit:cover; }

    /* Thumbnails strip */
    .pup-thumbs {
      display:flex; gap:6px; margin-top:8px; flex-wrap:wrap;
    }
    .pup-thumb {
      width:68px; height:54px;
      border:2px solid var(--border);
      border-radius:4px; overflow:hidden; cursor:pointer;
      flex-shrink:0; background:#f0f0f0;
      transition:border-color 0.15s;
    }
    .pup-thumb img { width:100%; height:100%; object-fit:cover; }
    .pup-thumb.active, .pup-thumb:hover { border-color:var(--primary); }

    /* Note du chiot */
    .pup-note-title {
      font-size:20px; font-weight:700; color:#1a3c4e;
      margin:28px 0 12px;
    }
    .pup-note-body {
      font-size:14px; color:#4a5568; line-height:1.8;
    }
    .pup-note-body p { margin-bottom:14px; }
    .pup-note-body strong { font-weight:700; }
    .pup-note-body em { font-style:italic; color:var(--secondary); }
    .pup-note-body a { color:var(--secondary); text-decoration:underline; }

    /* Specs table */
    .pup-specs-table {
      width:100%; border-collapse:collapse; margin-top:28px;
      border-top:1px solid var(--border);
    }
    .pup-specs-table tr { border-bottom:1px solid #eef2f5; }
    .pup-specs-table td {
      padding:11px 14px; font-size:14px; color:#4a5568;
    }
    .pup-specs-table td:first-child { color:#1a3c4e; width:38%; }

    /* ══ RIGHT: purchase panel ══ */
    .pup-panel { position:sticky; top:90px; display:flex; flex-direction:column; gap:12px; }

    /* Title card */
    .pup-title-card {
      background:#fff; border:1px solid var(--border);
      border-radius:8px; padding:20px 20px 16px;
    }
    .pup-panel-name {
      font-size:20px; font-weight:800; color:#1a3c4e; line-height:1.3;
      margin-bottom:4px;
    }
    .pup-panel-sub { font-size:13px; color:var(--text-light); margin-bottom:14px; }
    .pup-price {
      font-size:28px; font-weight:800; color:#1a3c4e;
      margin-bottom:4px;
    }
    .pup-price span { font-size:14px; color:var(--text-light); font-weight:400; margin-left:4px; }
    .pup-price-old {
      font-size:15px; color:var(--text-light); text-decoration:line-through; margin-bottom:16px;
    }

    /* Action buttons */
    .pup-btn-reserve {
      width:100%; padding:13px; background:var(--primary); color:#fff;
      border:none; font-size:15px; font-weight:700; cursor:pointer;
      border-radius:6px; margin-bottom:8px; transition:0.2s; font-family:inherit;
    }
    .pup-btn-reserve:hover { background:var(--primary-dark); }
    .pup-btn-enquire {
      width:100%; padding:12px; background:#fff; color:var(--primary);
      border:2px solid var(--primary); font-size:14px; font-weight:700;
      cursor:pointer; border-radius:6px; transition:0.2s; font-family:inherit;
    }
    .pup-btn-enquire:hover { background:var(--primary-light); }
    .pup-out-btn {
      width:100%; padding:13px; background:#e2e8f0; color:#718096;
      border:none; font-size:15px; font-weight:700;
      border-radius:6px; cursor:not-allowed; font-family:inherit;
    }

    /* Guarantee card */
    .pup-guarantee {
      background:#f8fafc; border:1px solid var(--border);
      border-radius:8px; padding:14px 16px;
      display:flex; align-items:center; gap:12px;
      font-size:13px; font-weight:600; color:#1a3c4e;
    }
    .pup-guarantee svg { flex-shrink:0; color:var(--secondary); }
    .sh-select {
      width:100%; margin-top:8px; padding:9px 10px;
      border:1px solid var(--border); font-size:13px; outline:none;
      font-family:inherit; color:var(--text); border-radius:4px; cursor:pointer;
    }

    /* Optional services */
    .pup-services-card {
      background:#fff; border:2px solid var(--accent);
      border-radius:8px; padding:14px 16px;
    }
    .pup-services-card .sv-title {
      font-size:13px; font-weight:700; color:var(--accent); margin-bottom:10px;
    }
    .sv-item {
      display:flex; align-items:center; gap:10px;
      padding:7px 0; border-bottom:1px solid #f0f0f0;
      font-size:13px; color:#4a5568; cursor:pointer;
    }
    .sv-item:last-child { border-bottom:none; }
    .sv-item input[type=checkbox] { accent-color:var(--primary); width:16px; height:16px; cursor:pointer; }
    .sv-item label { cursor:pointer; flex:1; }
    .sv-item .sv-price { font-weight:700; color:#1a3c4e; white-space:nowrap; }

    /* Total card */
    .pup-total-card {
      background:#fff; border:1px solid var(--border);
      border-radius:8px; padding:14px 16px;
    }
    .pup-total-row {
      display:flex; justify-content:space-between; align-items:center;
      margin-bottom:4px;
    }
    .pup-total-label { font-size:13px; font-weight:700; color:#1a3c4e; }
    .pup-total-val { font-size:20px; font-weight:800; color:#1a3c4e; }
    .pup-total-sub { font-size:11px; color:var(--text-light); }

    /* Included */
    .pup-included { margin-top:10px; display:flex; flex-direction:column; gap:5px; }
    .pup-included-row {
      display:flex; align-items:center; gap:8px;
      font-size:12px; color:#4a5568;
    }
    .pup-included-row .inc-icon { color:var(--secondary); font-size:14px; flex-shrink:0; }
    .pup-included-row .inc-free {
      margin-left:auto; font-size:11px;
      text-decoration:line-through; color:var(--text-light); margin-right:4px;
    }
    .pup-included-row .inc-tag {
      margin-left:auto; font-size:11px; font-weight:700;
      color:var(--secondary); background:#f0fff4; padding:1px 7px; border-radius:10px;
    }

    /* Donate card */
    .pup-donate-card {
      background:#f8fafc; border:1px solid var(--border);
      border-radius:8px; padding:14px 16px;
    }
    .pup-donate-card h4 { font-size:13px; font-weight:700; color:#1a3c4e; margin-bottom:6px; }
    .pup-donate-card p { font-size:12px; color:var(--text-light); line-height:1.6; margin-bottom:10px; }
    .pup-donate-select {
      width:100%; padding:8px 10px; border:1px solid var(--border);
      font-size:13px; outline:none; font-family:inherit; border-radius:4px;
    }

    /* ══ BOTTOM SECTIONS ══ */

    /* — Commitment banner — */
    .pup-commitment {
      background: #eef2f5; border-radius: 12px;
      padding: 36px 40px; margin: 48px 0;
    }
    .pup-commitment-inner {
      display: flex; align-items: flex-start; gap: 32px;
    }
    .pup-commit-icon { flex-shrink: 0; opacity: .7; }
    .pup-commit-body h3 {
      font-size: 22px; font-weight: 700; color: #1a3c4e;
      margin-bottom: 14px;
    }
    .pup-commit-body p {
      font-size: 14px; color: #5a7080; line-height: 1.8; margin-bottom: 16px;
    }
    .pup-commit-link {
      display: inline-block;
      border: 1.5px solid var(--secondary);
      color: var(--secondary); padding: 8px 18px;
      font-size: 13px; font-weight: 600; text-decoration: none;
      border-radius: 4px; transition: 0.2s;
    }
    .pup-commit-link:hover { background: var(--secondary); color: #fff; }

    /* — Breed reviews carousel — */
    .pup-breed-reviews { padding: 0 0 60px; }
    .pup-reviews-title {
      font-size: 22px; font-weight: 700; color: #1a3c4e;
      text-align: center; margin-bottom: 32px; line-height: 1.4;
    }
    .pup-reviews-title em { font-style: italic; color: var(--secondary); }

    .pbr-carousel { overflow: hidden; }
    .pbr-track {
      display: flex; transition: transform 0.5s cubic-bezier(0.4,0,0.2,1);
    }
    .pbr-slide {
      min-width: 100%; display: grid;
      grid-template-columns: 340px 1fr; gap: 40px; align-items: start;
    }
    .pbr-img {
      width: 100%; aspect-ratio: 4/3;
      object-fit: cover; border-radius: 10px;
    }
    .pbr-img-placeholder {
      width: 100%; aspect-ratio: 4/3;
      background: #eef2f5; border-radius: 10px;
      display: flex; align-items: center; justify-content: center; font-size: 56px; opacity: .4;
    }
    .pbr-quote { font-size: 48px; color: #1a3c4e; line-height: 1; margin-bottom: 12px; font-family: Georgia, serif; }
    .pbr-text {
      font-size: 14px; color: #4a5568; line-height: 1.8; margin-bottom: 14px;
      display: -webkit-box; -webkit-line-clamp: 8; -webkit-box-orient: vertical; overflow: hidden;
    }
    .pbr-text.expanded { -webkit-line-clamp: unset; overflow: visible; }
    .pbr-read-more {
      font-size: 13px; color: var(--secondary); font-weight: 600;
      background: none; border: none; cursor: pointer; padding: 0; font-family: inherit;
      text-decoration: underline;
    }
    .pbr-author { margin-top: 16px; }
    .pbr-author strong { font-size: 14px; font-weight: 700; color: #1a3c4e; display: block; }
    .pbr-author span { font-size: 12px; color: var(--text-light); }

    .pbr-dots {
      display: flex; justify-content: center; gap: 10px; margin-top: 28px;
    }
    .pbr-dot {
      width: 12px; height: 12px; border-radius: 50%;
      background: #c0cdd5; cursor: pointer; border: none;
      transition: background 0.2s, transform 0.2s;
    }
    .pbr-dot.active { background: var(--secondary); transform: scale(1.25); }

    /* — Related puppies carousel — */
    .pup-related-section { padding: 0 0 12px; }
    .pup-related-title {
      font-size: 22px; font-weight: 700; color: #1a3c4e;
      text-align: center; margin-bottom: 28px;
    }
    .pup-related-title em { font-style: italic; color: var(--secondary); }

    .pup-related-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;
    }
    .pup-related-card { cursor: pointer; border-radius: 12px; overflow: hidden; }
    .prc-img {
      position: relative; aspect-ratio: 4/3; overflow: hidden;
      background: #eef2f5;
    }
    .prc-img img {
      width: 100%; height: 100%; object-fit: cover;
      transition: transform 0.4s;
    }
    .pup-related-card:hover .prc-img img { transform: scale(1.06); }
    .prc-placeholder { display: flex; align-items: center; justify-content: center; height: 100%; font-size: 56px; opacity: .3; }
    .prc-overlay {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: linear-gradient(transparent, rgba(0,0,0,0.72));
      padding: 28px 14px 14px; color: #fff;
    }
    .prc-name { font-size: 15px; font-weight: 700; margin-bottom: 3px; }
    .prc-meta { font-size: 12px; opacity: .85; }

    .pup-related-dots {
      display: flex; justify-content: center; gap: 10px; margin-top: 20px;
    }

    /* — Shared buttons — */
    .pup-more-btn {
      display: inline-block; padding: 11px 28px;
      border: 2px solid var(--primary); color: var(--primary);
      font-size: 14px; font-weight: 700; text-decoration: none;
      border-radius: 30px; transition: 0.2s; background: #fff;
    }
    .pup-more-btn:hover { background: var(--primary); color: #fff; }
    .pup-more-btn-green { border-color: var(--secondary); color: var(--secondary); }
    .pup-more-btn-green:hover { background: var(--secondary); color: #fff; }

    @media (max-width: 700px) {
      .pup-commitment-inner { flex-direction: column; gap: 16px; }
      .pbr-slide { grid-template-columns: 1fr; gap: 20px; }
      .pup-related-grid { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 480px) {
      .pup-related-grid { grid-template-columns: 1fr; }
    }

    /* ══ LIGHTBOX ══ */
    .lb { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.93); z-index:1000; align-items:center; justify-content:center; cursor:zoom-out; }
    .lb.open { display:flex; }
    .lb img { max-width:92vw; max-height:92vh; object-fit:contain; border-radius:6px; }
    .lb-close { position:absolute; top:18px; right:22px; color:#fff; font-size:36px; cursor:pointer; background:none; border:none; opacity:.8; }
    .lb-prev, .lb-next { position:absolute; top:50%; transform:translateY(-50%); background:rgba(255,255,255,.15); border:none; color:#fff; font-size:32px; width:50px; height:50px; cursor:pointer; display:flex; align-items:center; justify-content:center; border-radius:0; }
    .lb-prev { left:16px; } .lb-next { right:16px; }
    .lb-prev:hover, .lb-next:hover { background:rgba(255,255,255,.3); }

    @media(max-width:960px) {
      .pup-grid { grid-template-columns:1fr; }
      .pup-panel { position:static; }
    }
    @media(max-width:600px) {
      .pup-thumb { width:54px; height:44px; }
      .pup-panel-name { font-size:17px; }
      .pup-price { font-size:22px; }
    }
  </style>
</head>

<script>
const productId = new URLSearchParams(location.search).get('id');
if (!productId) location.href = '/shop.html';

let _imgs = [], _lbIdx = 0;

// ── optional service add-ons ──
const SERVICES = [
  { id:'pedigree',    label:'Export Pedigree',         price:150 },
  { id:'training',    label:'Residential Training',    price:900 },
  { id:'tag',         label:'Paw Puppies ID Tag',          price:20  },
  { id:'guarantee',   label:'Refund Guarantee',        price:1290},
];

function switchPhoto(thumbEl, src, idx) {
  document.getElementById('pup-main-photo').src = src;
  document.querySelectorAll('.pup-thumb').forEach(t => t.classList.remove('active'));
  thumbEl.classList.add('active');
  _lbIdx = idx;
}
function openLb(src) {
  _lbIdx = _imgs.indexOf(src);
  if (_lbIdx < 0) _lbIdx = 0;
  document.getElementById('lb-img').src = src;
  document.getElementById('lb').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeLb() {
  document.getElementById('lb').classList.remove('open');
  document.body.style.overflow = '';
}
function lbNav(dir) {
  if (!_imgs.length) return;
  _lbIdx = (_lbIdx + dir + _imgs.length) % _imgs.length;
  document.getElementById('lb-img').src = _imgs[_lbIdx];
  document.getElementById('pup-main-photo').src = _imgs[_lbIdx];
  document.querySelectorAll('.pup-thumb').forEach((t,i) => t.classList.toggle('active', i===_lbIdx));
}
document.addEventListener('keydown', e => {
  if (!document.getElementById('lb').classList.contains('open')) return;
  if (e.key==='ArrowRight') lbNav(1);
  if (e.key==='ArrowLeft')  lbNav(-1);
  if (e.key==='Escape')     closeLb();
});

function recalcTotal() {
  const base = parseFloat(document.getElementById('pup-base-price')?.dataset.price || 0);
  let extra = 0;
  SERVICES.forEach(s => {
    const cb = document.getElementById('svc-'+s.id);
    if (cb && cb.checked) extra += s.price;
  });
  const symbol = (siteSettings && siteSettings.currency_symbol) || '£';
  const total = base + extra;
  const el = document.getElementById('pup-total-val');
  if (el) el.textContent = `${total.toLocaleString('en-GB', {minimumFractionDigits:0})} ${symbol}`;
}

// ── Breed reviews carousel ──────────────────────────────────────────────────
async function loadBreedReviews(breedName) {
  const track = document.getElementById('pbr-track');
  const dotsEl = document.getElementById('pbr-dots');
  if (!track) return;

  try {
    const res  = await fetch(`/api/reviews?breed=${encodeURIComponent(breedName)}&limit=6`);
    const data = await res.json();
    const reviews = data.reviews || [];

    if (!reviews.length) {
      // Hide entire reviews section if no reviews
      const sec = document.getElementById('pup-breed-reviews');
      if (sec) sec.style.display = 'none';
      return;
    }

    let currentRev = 0;

    track.innerHTML = reviews.map((r, idx) => {
      const imgs = Array.isArray(r.images) ? r.images : [];
      return `
      <div class="pbr-slide" id="pbr-slide-${idx}">
        <div>
          ${imgs[0]
            ? `<img class="pbr-img" src="${imgs[0]}" alt="${r.puppy_name||r.author}" loading="lazy">`
            : `<div class="pbr-img-placeholder">🐾</div>`}
        </div>
        <div>
          <div class="pbr-quote">❝</div>
          <div class="pbr-text" id="pbr-txt-${idx}">${r.text}</div>
          <button class="pbr-read-more" onclick="togglePbrText(${idx})">Read more</button>
          <div class="pbr-author">
            <strong>${r.puppy_name || r.author}</strong>
            <span>${r.author}${r.location ? ' — ' + r.location : ''}</span>
          </div>
        </div>
      </div>`;
    }).join('');

    // Dots
    const renderDots = () => {
      dotsEl.innerHTML = reviews.map((_,i) =>
        `<button class="pbr-dot${i===currentRev?' active':''}" onclick="goRev(${i})"></button>`
      ).join('');
    };

    window.goRev = (idx) => {
      currentRev = idx;
      track.style.transform = `translateX(-${idx * 100}%)`;
      renderDots();
    };

    window.togglePbrText = (idx) => {
      const el = document.getElementById(`pbr-txt-${idx}`);
      const btn = el.nextElementSibling;
      if (el.classList.contains('expanded')) {
        el.classList.remove('expanded'); btn.textContent = 'Read more';
      } else {
        el.classList.add('expanded'); btn.textContent = 'Show less';
      }
    };

    renderDots();

    // Auto-advance every 5s
    let timer = setInterval(() => goRev((currentRev + 1) % reviews.length), 5000);
    track.addEventListener('mouseenter', () => clearInterval(timer));
    track.addEventListener('mouseleave', () => {
      timer = setInterval(() => goRev((currentRev + 1) % reviews.length), 5000);
    });

  } catch(e) {
    const sec = document.getElementById('pup-breed-reviews');
    if (sec) sec.style.display = 'none';
  }
}
