    <div class="admin-content">
      <div class="card">
        <div class="card-header">
          <div class="search-bar-admin" style="margin:0;flex:1">
            <input type="text" id="search" placeholder="N° commande, client, email..." oninput="loadOrders()">
            <select id="status-filter" onchange="loadOrders()">
              <option value="all">Tous les statuts</option>
              <option value="pending">En attente</option>
              <option value="processing">En cours</option>
              <option value="shipped">Expédié</option>
              <option value="delivered">Livré</option>
              <option value="cancelled">Annulé</option>
            </select>
          </div>

        <div class="card-body" style="padding:0">

            <table>
              <thead><tr><th>N° Commande</th><th>Client</th><th>Produits</th><th>Total</th><th>Paiement</th><th>Statut</th><th>Date</th><th>Action</th></tr></thead>
              <tbody id="orders-table"></tbody>
            </table>

<!-- ORDER DETAIL MODAL -->
<div class="modal-overlay" id="order-modal">
  <div class="modal" style="max-width:720px">
    <div class="modal-header">
      <h2 id="order-modal-title">Détail commande</h2>
      <button class="modal-close" onclick="closeModal('order-modal')">×</button>
    </div>
    <div class="modal-body" id="order-modal-body"></div>
    <div class="modal-footer">
      <select id="new-status">
        <option value="pending">En attente</option>
        <option value="processing">En cours</option>
        <option value="shipped">Expédié</option>
        <option value="delivered">Livré</option>
        <option value="cancelled">Annulé</option>
      </select>
      <button class="btn btn-primary" onclick="updateStatus()">Mettre à jour le statut</button>
      <button class="btn btn-outline" onclick="closeModal('order-modal')">Fermer</button>
    </div>
  </div>
</div>

<div class="toast" id="admin-toast"></div>
<script src="/admin/admin-common.js"></script>
<script>
let currentPage = 1, currentOrderId = null;
const urlParams = new URLSearchParams(location.search);

(async () => {
  if (!await requireAuth()) return;
  loadSidebarBranding();
  loadUnreadBadge();
  if (urlParams.get('status')) document.getElementById('status-filter').value = urlParams.get('status');
  loadOrders();
})();

async function loadOrders(page = 1) {
  currentPage = page;
  const search = document.getElementById('search').value;
  const status = document.getElementById('status-filter').value;
  const q = new URLSearchParams({ page, limit: 20 });
  if (search) q.set('search', search);
  if (status !== 'all') q.set('status', status);

  const data = await fetch(`/api/orders?${q}`, { headers: { Authorization: `Bearer ${getToken()}` } }).then(r => r.json());
  const tbody = document.getElementById('orders-table');
  const payLabels = { cod: '💵 Contre-remb.', bank: '🏦 Virement' };

  tbody.innerHTML = data.orders.length ? data.orders.map(o => `
    <tr>
      <td><strong>${o.order_number}</strong></td>
      <td>${o.customer_name}<br><small style="color:#718096">${o.customer_email}</small></td>
      <td><small>${o.items.length} article(s)</small></td>
      <td><strong>${formatPrice(o.total)}</strong></td>
      <td><small>${payLabels[o.payment_method] || o.payment_method}</small></td>
      <td>${statusBadge(o.status)}</td>
      <td>${formatDate(o.created_at)}</td>
      <td>
        <button class="btn btn-outline btn-sm" onclick="viewOrder(${o.id})">👁️</button>
        <button class="btn btn-danger btn-sm" onclick="deleteOrder(${o.id})">🗑️</button>
      </td>
    </tr>
  `).join('') : '<tr><td colspan="8" style="text-align:center;padding:30px;color:#718096">Aucune commande</td></tr>';

  renderPagination('pagination', data.totalPages, page, 'loadOrders');
}

async function viewOrder(id) {
  currentOrderId = id;
  const o = await fetch(`/api/orders/${id}`, { headers: { Authorization: `Bearer ${getToken()}` } }).then(r => r.json());
  document.getElementById('order-modal-title').textContent = `Reservation ${o.order_number}`;
  document.getElementById('new-status').value = o.status;

  // Parse shipping address — stored as "address, city, zip, country" or JSON
  let addrLine = o.shipping_address || '';
  let addrParts = { address: '—', city: '—', zip: '—', country: '—' };
  if (addrLine.startsWith('{')) {
    try { addrParts = { ...addrParts, ...JSON.parse(addrLine) }; } catch {}
  } else if (addrLine.includes(',')) {
    const parts = addrLine.split(',').map(s => s.trim());
    // format: "address, city, zip, country"
    if (parts.length >= 4) {
      addrParts = { address: parts[0], city: parts[1], zip: parts[2], country: parts.slice(3).join(', ') };
    } else if (parts.length === 3) {
      addrParts = { address: parts[0], city: parts[1], zip: '', country: parts[2] };
    } else if (parts.length === 2) {
      addrParts = { address: parts[0], city: '', zip: '', country: parts[1] };
    } else {
      addrParts.address = addrLine;
    }
  } else if (addrLine) {
    addrParts.address = addrLine;
  }

  const payLabels = { cod: '💵 Cash on Delivery', bank: '🏦 Bank Transfer', reservation: '📋 Reservation' };

  document.getElementById('order-modal-body').innerHTML = `
    <style>
      .od-section { margin-bottom:20px; }
      .od-section-title {
        font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.6px;
        color:var(--primary); margin-bottom:10px; padding-bottom:6px;
        border-bottom:1px solid var(--border); display:flex; align-items:center; gap:6px;
      }
      .od-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
      .od-field { background:var(--bg); padding:10px 12px; border-radius:6px; }
      .od-field-label { font-size:10px; font-weight:700; color:#a0aec0; text-transform:uppercase; letter-spacing:0.4px; margin-bottom:3px; }
      .od-field-value { font-size:13px; color:#2d3748; font-weight:500; word-break:break-word; }
      .od-field-value.empty { color:#cbd5e0; font-style:italic; }
      .od-items-table { width:100%; border-collapse:collapse; font-size:13px; }
      .od-items-table th { background:var(--bg); padding:8px 10px; text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.4px; color:#718096; font-weight:700; }
      .od-items-table td { padding:10px; border-bottom:1px solid var(--border); vertical-align:middle; }
      .od-items-table tr:last-child td { border-bottom:none; }
      .od-totals { display:flex; flex-direction:column; align-items:flex-end; gap:5px; padding:12px 0 0; }
      .od-totals .od-total-row { display:flex; justify-content:flex-end; gap:16px; font-size:13px; color:#4a5568; }
      .od-totals .od-total-row.main { font-size:16px; font-weight:800; color:var(--primary); padding-top:6px; border-top:2px solid var(--border); margin-top:4px; }
      .od-badge-pill { display:inline-block; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:700; }
    </style>

    <!-- Client -->
    <div class="od-section">
      <div class="od-section-title">👤 Customer Information</div>
      <div class="od-grid">
        <div class="od-field">
          <div class="od-field-label">Full Name</div>
          <div class="od-field-value">${o.customer_name || '—'}</div>
        </div>
        <div class="od-field">
          <div class="od-field-label">Email</div>
          <div class="od-field-value">${o.customer_email || '—'}</div>
        </div>
        <div class="od-field">
          <div class="od-field-label">Phone</div>
          <div class="od-field-value ${!o.customer_phone ? 'empty' : ''}">${o.customer_phone || 'Not provided'}</div>
        </div>
        <div class="od-field">
          <div class="od-field-label">Payment Method</div>
          <div class="od-field-value">${payLabels[o.payment_method] || o.payment_method}</div>
        </div>
      </div>
    </div>

    <!-- Adresse -->
    <div class="od-section">
      <div class="od-section-title">📍 Shipping Address</div>
      <div class="od-grid">
        <div class="od-field" style="grid-column:1/-1">
          <div class="od-field-label">Street Address</div>
          <div class="od-field-value ${addrParts.address === '—' ? 'empty' : ''}">${addrParts.address}</div>
        </div>
        <div class="od-field">
          <div class="od-field-label">City</div>
          <div class="od-field-value ${addrParts.city === '—' || !addrParts.city ? 'empty' : ''}">${addrParts.city || 'Not provided'}</div>
        </div>
        <div class="od-field">
          <div class="od-field-label">Zip / Postal Code</div>
          <div class="od-field-value ${!addrParts.zip ? 'empty' : ''}">${addrParts.zip || 'Not provided'}</div>
        </div>
        <div class="od-field" style="grid-column:1/-1">
          <div class="od-field-label">Country</div>
          <div class="od-field-value ${addrParts.country === '—' ? 'empty' : ''}">${addrParts.country}</div>
        </div>
      </div>
    </div>

    <!-- Articles -->
    <div class="od-section">
      <div class="od-section-title">🐾 Reserved Puppy</div>
      <table class="od-items-table">
        <thead>
          <tr>
            <th>Puppy</th>
            <th style="text-align:center">Qty</th>
            <th style="text-align:right">Price</th>
          </tr>
        </thead>
        <tbody>
          ${o.items.map(i => `
            <tr>
              <td><strong>${i.name}</strong></td>
              <td style="text-align:center">${i.quantity}</td>
              <td style="text-align:right;font-weight:600">${formatPrice(i.price * i.quantity)}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
      <div class="od-totals">
        <div class="od-total-row"><span>Subtotal</span><span>${formatPrice(o.subtotal)}</span></div>
        <div class="od-total-row"><span>Shipping</span><span>${o.shipping_cost === 0 ? '<span style="color:var(--secondary)">Free</span>' : formatPrice(o.shipping_cost)}</span></div>
        <div class="od-total-row main"><span>Total</span><span>${formatPrice(o.total)}</span></div>
      </div>
    </div>

    <!-- Notes -->
    ${o.notes ? `
    <div class="od-section">
      <div class="od-section-title">💬 Customer Message</div>
      <div style="background:var(--bg);padding:12px 14px;border-radius:6px;font-size:13px;color:#4a5568;line-height:1.7;white-space:pre-wrap">${o.notes}</div>
    </div>` : ''}

    <!-- Meta -->
    <div class="od-section" style="margin-bottom:0">
      <div class="od-section-title">🕐 Order Info</div>
      <div class="od-grid">
        <div class="od-field">
          <div class="od-field-label">Order Number</div>
          <div class="od-field-value" style="font-family:monospace">${o.order_number}</div>
        </div>
        <div class="od-field">
          <div class="od-field-label">Date Received</div>
          <div class="od-field-value">${formatDate(o.created_at)}</div>
        </div>
      </div>
    </div>
  `;
  openModal('order-modal');
}

async function updateStatus() {
  const status = document.getElementById('new-status').value;
  const res = await fetch(`/api/orders/${currentOrderId}/status`, { method: 'PUT', headers: authHeaders(), body: JSON.stringify({ status }) });
  const data = await res.json();
  if (data.success) { showToast('✅ Statut mis à jour', 'success'); closeModal('order-modal'); loadOrders(currentPage); }
  else showToast('❌ Erreur', 'error');
}

async function deleteOrder(id) {
  if (!confirmDelete('Supprimer cette commande ?')) return;
  await fetch(`/api/orders/${id}`, { method: 'DELETE', headers: authHeaders() });
  showToast('✅ Commande supprimée', 'success');
  loadOrders(currentPage);
}
</script>
